<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8f4"><link rel="manifest" href="manifest.webmanifest"><title>日序 Dayflow</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#263b33;background:#f7f8f4}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.layout{max-width:1100px;margin:auto;padding:35px 24px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:800;letter-spacing:1px}.muted{color:#87948b;font-size:13px}.hero{margin:42px 0 26px}.hero h1{font-size:32px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}.panel,.stat{background:#fff;border:1px solid #e9eee9;border-radius:18px;padding:22px;box-shadow:0 8px 30px #24452c07}.stat strong{display:block;font-size:28px;margin-top:9px}.main{display:grid;grid-template-columns:1.7fr 1fr;gap:20px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-title h2{font-size:18px;margin:0}.primary{border:0;background:#668c79;color:white;border-radius:11px;padding:11px 17px}.secondary{background:#edf3ee;border:0;color:#567663;border-radius:10px;padding:8px 11px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters button{border:0;background:#f3f6f2;border-radius:9px;padding:7px 12px;color:#62786b}.filters button.active{background:#dce9df;color:#315a40}.task{display:flex;align-items:center;gap:11px;border-top:1px solid #edf1ed;padding:14px 0}.task input{accent-color:#668c79;width:18px;height:18px}.task .content{flex:1;min-width:0}.task .name{font-weight:600;overflow-wrap:anywhere}.task.done .name{text-decoration:line-through;color:#9aa69e}.tag{display:inline-block;font-size:11px;color:#68806e;background:#eef4ed;border-radius:6px;padding:3px 6px;margin-top:6px;margin-right:6px}.task .actions{display:flex;gap:5px}.task .actions button{border:0;background:transparent;color:#84958a;padding:6px}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.calendar-head h3{margin:0;font-size:16px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.calendar .day{border:0;background:transparent;min-height:35px;border-radius:9px;color:#496354;position:relative}.calendar .weekday{font-size:11px;color:#9daaa0;padding:8px 0}.calendar .selected{background:#668c79;color:white}.calendar .today:not(.selected){outline:1px solid #8eac98}.calendar .has-task:after{content:'';position:absolute;width:4px;height:4px;background:#df9b69;border-radius:50%;bottom:3px;left:calc(50% - 2px)}.progress{height:8px;background:#e9f0e9;border-radius:20px;overflow:hidden;margin:15px 0}.progress span{display:block;background:#80a58c;height:100%}.empty{text-align:center;color:#9aa69e;padding:32px 0}.modal{position:fixed;inset:0;background:#182a2090;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{background:white;border-radius:20px;padding:25px;width:min(450px,100%)}.dialog h2{margin-top:0}.field{display:block;margin:13px 0;font-size:13px;color:#647b6b}.field input,.field select{display:block;width:100%;border:1px solid #e1e9e2;border-radius:10px;padding:12px;margin-top:7px;background:#fff;color:#263b33}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.foot{margin-top:25px;text-align:center;color:#a0ada3;font-size:12px}@media(max-width:700px){.layout{padding:20px 15px}.hero{margin:28px 0 22px}.hero h1{font-size:26px}.stats{gap:8px}.stat{padding:15px}.stat strong{font-size:23px}.main{grid-template-columns:1fr}.panel{padding:17px}.brand{font-size:19px}}
</style></head><body><div class="layout"><header class="top"><div class="brand">🌿 日序 <span class="muted">DAYFLOW</span></div><button class="secondary" id="export">导出备份</button></header><div class="hero"><div class="muted" id="dateLabel"></div><h1>把日子过得有条不紊。</h1><div class="muted">记录每件小事，慢慢完成大目标。</div></div><div class="stats"><div class="stat"><span class="muted">全部任务</span><strong id="total">0</strong></div><div class="stat"><span class="muted">已完成</span><strong id="done">0</strong></div><div class="stat"><span class="muted">完成率</span><strong id="rate">0%</strong></div></div><div class="main"><section class="panel"><div class="section-title"><h2 id="listTitle">我的待办</h2><button class="primary" id="add">＋ 添加任务</button></div><div class="filters" id="filters"></div><div id="tasks"></div></section><aside><section class="panel"><div class="calendar-head"><button class="secondary" id="prev">‹</button><h3 id="month"></h3><button class="secondary" id="next">›</button></div><div class="calendar" id="calendar"></div><button class="secondary" style="margin-top:15px;width:100%" id="allDates">显示全部日期</button></section><section class="panel" style="margin-top:20px"><h3 style="margin-top:0">完成进度</h3><div class="muted" id="progressLabel">继续加油</div><div class="progress"><span id="progressBar" style="width:0%"></span></div><div class="muted">数据保存在当前浏览器。跨设备同步将在后续版本加入。</div><label class="secondary" style="display:block;text-align:center;margin-top:16px;cursor:pointer">导入备份<input type="file" accept="application/json" id="import" hidden></label></section></aside></div><div class="foot">Dayflow · 给日常留一点从容</div></div><div class="modal" id="modal"><form class="dialog" id="form"><h2 id="dialogTitle">新建任务</h2><label class="field">任务名称<input id="taskName" maxlength="120" required placeholder="例如：阅读一篇文献"></label><label class="field">截止日期<input id="taskDate" type="date"></label><label class="field">任务分类<select id="taskCategory"><option>科研学习</option><option>课程作业</option><option>个人生活</option><option>其他</option></select></label><label class="field">优先级<select id="taskPriority"><option>普通</option><option>重要</option><option>紧急</option></select></label><div class="dialog-actions"><button type="button" class="secondary" id="cancel">取消</button><button class="primary">保存任务</button></div></form></div><script>
const KEY='dayflow-tasks-v1';let tasks=[];try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(x))tasks=x}catch{}let filter='全部',selected='',editing=null,view=new Date();const $=id=>document.getElementById(id),today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};const save=()=>{localStorage.setItem(KEY,JSON.stringify(tasks));render()};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const n=tasks.length,d=tasks.filter(t=>t.done).length,r=n?Math.round(d/n*100):0;$('total').textContent=n;$('done').textContent=d;$('rate').textContent=r+'%';$('progressBar').style.width=r+'%';$('progressLabel').textContent=`已完成 ${d} / ${n} 项任务`;$('dateLabel').textContent=new Intl.DateTimeFormat('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date());$('filters').innerHTML=['全部','科研学习','课程作业','个人生活','其他'].map(c=>`<button class="${filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('');$('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});let visible=tasks.filter(t=>(filter==='全部'||t.category===filter)&&(!selected||t.date===selected)).sort((a,b)=>Number(a.done)-Number(b.done)||(a.date||'9999').localeCompare(b.date||'9999'));$('listTitle').textContent=selected?selected+' 的待办':'我的待办';$('tasks').innerHTML=visible.length?visible.map(t=>`<div class="task ${t.done?'done':''}" data-id="${esc(t.id)}"><input type="checkbox" aria-label="完成任务" ${t.done?'checked':''}><div class="content"><div class="name">${esc(t.name)}</div><span class="tag">${esc(t.category)}</span><span class="tag">${esc(t.priority)}</span>${t.date?`<span class="tag">${esc(t.date)}</span>`:''}</div><div class="actions"><button class="edit" title="编辑">✎</button><button class="delete" title="删除">✕</button></div></div>`).join(''):'<div class="empty">这里还没有任务，添加第一件小事吧 ☘</div>';$('tasks').querySelectorAll('.task').forEach(el=>{let id=el.dataset.id;el.querySelector('input').onchange=e=>{tasks.find(t=>t.id===id).done=e.target.checked;save()};el.querySelector('.edit').onclick=()=>openDialog(id);el.querySelector('.delete').onclick=()=>{if(confirm('确定删除这项任务吗？')){tasks=tasks.filter(t=>t.id!==id);save()}}});calendar()}
function calendar(){let y=view.getFullYear(),m=view.getMonth();$('month').textContent=`${y} 年 ${m+1} 月`;let start=(new Date(y,m,1).getDay()+6)%7,days=new Date(y,m+1,0).getDate();$('calendar').innerHTML=['一','二','三','四','五','六','日'].map(x=>`<div class="weekday">${x}</div>`).join('')+Array(start).fill('<div></div>').join('')+Array.from({length:days},(_,i)=>{let date=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;return `<button class="day ${date===selected?'selected':''} ${date===today()?'today':''} ${tasks.some(t=>t.date===date)?'has-task':''}" data-date="${date}">${i+1}</button>`}).join('');$('calendar').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=selected===b.dataset.date?'':b.dataset.date;render()})}
function openDialog(id=null){editing=id;let t=tasks.find(x=>x.id===id);$('dialogTitle').textContent=t?'编辑任务':'新建任务';$('taskName').value=t?.name||'';$('taskDate').value=t?.date||selected||today();$('taskCategory').value=t?.category||'科研学习';$('taskPriority').value=t?.priority||'普通';$('modal').classList.add('open');$('taskName').focus()}function closeDialog(){$('modal').classList.remove('open');editing=null}$('add').onclick=()=>openDialog();$('cancel').onclick=closeDialog;$('modal').onclick=e=>{if(e.target===$('modal'))closeDialog()};$('form').onsubmit=e=>{e.preventDefault();let data={name:$('taskName').value.trim(),date:$('taskDate').value,category:$('taskCategory').value,priority:$('taskPriority').value};if(!data.name)return;if(editing)Object.assign(tasks.find(t=>t.id===editing),data);else tasks.push({id:crypto.randomUUID?.()||String(Date.now())+Math.random(),...data,done:false});closeDialog();save()};$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('allDates').onclick=()=>{selected='';render()};$('export').onclick=()=>{let a=document.createElement('a'),blob=new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='dayflow-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(t=>typeof t.id==='string'&&typeof t.name==='string'&&typeof t.done==='boolean'))throw Error('格式不正确');if(confirm('导入会替换当前任务，确定继续吗？')){tasks=data.map(t=>({id:t.id,name:t.name,date:typeof t.date==='string'?t.date:'',category:typeof t.category==='string'?t.category:'其他',priority:typeof t.priority==='string'?t.priority:'普通',done:t.done}));save()}}catch(err){alert('导入失败：'+err.message)}e.target.value=''};render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
